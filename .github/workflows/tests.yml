name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    name: tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise
        id: setup-mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Install dependencies
        id: install-deps
        working-directory: windows
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r ../requirements.txt -r requirements-dev.txt
      - name: Run tests
        id: run-tests
        working-directory: windows
        run: |
          python -m pytest tests -q 2>&1 | Out-File -FilePath "$env:RUNNER_TEMP\pytest-report.txt" -Encoding utf8
          $code = $LASTEXITCODE
          "TEST_EXIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Append
          exit 0
      - name: Report result to PR
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $pr = $event.pull_request.number
          if (-not $pr) {
            Write-Host "Not a pull_request run - skipping comment"
            exit 0
          }
          $report = "$env:RUNNER_TEMP\pytest-report.txt"
          $out = ""
          if (Test-Path $report) {
            $out = Get-Content -Raw $report
          }
          $exit = -1
          if ($env:TEST_EXIT -ne $null) { $exit = [int]$env:TEST_EXIT }

          $summary = "no pytest summary captured"
          $matches = [regex]::Matches($out, '(?m)^\s*\d+ passed.*$')
          if ($matches.Count -gt 0) {
            $summary = $matches[$matches.Count - 1].Value.Trim()
          }

          $failedTests = @()
          foreach ($line in ($out -split "`r?`n")) {
            if ($line -match '^FAILED\s+([^\s]+)') { $failedTests += $Matches[1] }
          }

          $verdict = if ($exit -eq 0) { "**Result:** PASSED" } else { "**Result:** FAILED (exit $exit)" }
          $conclusions = "mise=${{ steps.setup-mise.conclusion }}, deps=${{ steps.install-deps.conclusion }}, tests=${{ steps.run-tests.conclusion }}"
          if ($conclusions -match 'failure|skipped') {
            $verdict = $verdict + "`n`n_Step conclusions — $conclusions — check the workflow log._"
          }
          $failBlock = ""
          if ($failedTests.Count -gt 0) {
            $failBlock = "**Failed tests:**`n" + ($failedTests -join "`n")
          }

          $fence = '```'
          $body = '<!-- dualtouch-tests -->' + "`n" +
            "## Tests on $env:GITHUB_SHA" + "`n`n" +
            $verdict + "`n`n" +
            "**Summary:** $summary" + "`n" +
            $failBlock + "`n`n" +
            '<details><summary>Full output</summary>' + "`n`n" +
            $fence + 'text' + "`n" +
            $out + "`n" +
            $fence + "`n" +
            '</details>'

          $headers = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $existing = Invoke-RestMethod -Uri "$api/issues/$pr/comments?per_page=100" -Headers $headers -Method Get
          $mine = $existing | Where-Object { $_.body -like '<!-- dualtouch-tests -->*' } | Select-Object -First 1
          $payload = @{ body = $body } | ConvertTo-Json
          if ($mine) {
            Invoke-RestMethod -Uri "$api/issues/comments/$($mine.id)" -Headers $headers -Method Patch -Body $payload -ContentType "application/json" | Out-Null
          } else {
            Invoke-RestMethod -Uri "$api/issues/$pr/comments" -Headers $headers -Method Post -Body $payload -ContentType "application/json" | Out-Null
          }
          Write-Host "Comment posted for PR #$pr"

          if ($exit -ne 0) {
            Write-Host "::error::Tests failed (exit $exit)"
            exit 1
          }
