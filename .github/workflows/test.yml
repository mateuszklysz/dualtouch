name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          # Full history so pre-commit can diff against origin/main.
          fetch-depth: 0

      # Installs mise + everything in mise.toml (python 3.12, uv,
      # pre-commit) and puts the shims on PATH for later steps.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt
          pip install -r windows/requirements-dev.txt

      - name: Install tools (mise.toml pre-commit)
        run: mise install

      - name: Run tests
        working-directory: windows
        env:
          PYTEST_ADDOPTS: "--junitxml=test-results/junit.xml"
        run: python -m pytest tests -q

      - name: Run pre-commit (origin/main..HEAD)
        run: mise exec -- pre-commit run -av --from-ref origin/main --to-ref HEAD

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: junit-results
          path: windows/test-results/junit.xml
          if-no-files-found: warn
