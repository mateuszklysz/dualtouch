name: Build release assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows release package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          # Full history so build.py can read the latest tag for the exe version.
          fetch-depth: 0

      # mise provides python 3.12 (see mise.toml); action caches installs.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install --prefer-binary -r requirements.txt

      - name: Build Windows binaries
        working-directory: windows
        env:
          # Tag builds name their artifacts after the pushed tag; empty on
          # workflow_dispatch (build.py then falls back to the latest tag).
          DUALTOUCH_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python build.py --installer

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          # Nuitka onedir build: ship the whole dist folder (exe + helper + data) as-is.
          Copy-Item -LiteralPath windows\dist\DualTouch-windows -Destination release\DualTouch-windows -Recurse
          Copy-Item -LiteralPath README.md,LICENSE -Destination release\DualTouch-windows\
          Compress-Archive -Path release\DualTouch-windows -DestinationPath DualTouch-windows-portable.zip -Force
          # Inno Setup installer as its own release asset (built into windows\dist).
          Copy-Item -Path windows\dist\DualTouch-windows-setup-*.exe -Destination .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: DualTouch-windows
          path: |
            DualTouch-windows-portable.zip
            DualTouch-windows-setup-*.exe

      - name: Attach Windows artifact to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 #v3.0.2
        with:
          files: |
            DualTouch-windows-portable.zip
            DualTouch-windows-setup-*.exe
