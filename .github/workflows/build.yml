name: Build release assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows release package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install --prefer-binary -r requirements.txt

      - name: Build Windows binaries
        working-directory: windows
        run: python build.py

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\DualTouch-windows | Out-Null
          Copy-Item -LiteralPath windows\dist\DualTouch-windows.exe -Destination release\DualTouch-windows\
          Copy-Item -LiteralPath README.md,LICENSE -Destination release\DualTouch-windows\
          Compress-Archive -Path release\DualTouch-windows -DestinationPath DualTouch-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: DualTouch-windows
          path: DualTouch-windows.zip

      - name: Attach Windows artifact to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 #v3.0.2
        with:
          files: DualTouch-windows.zip
